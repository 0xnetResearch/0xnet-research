<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>0xnet research page</title></head>
<body style="font:15px/1.4 sans-serif;padding:14px;background:#fff;color:#000">
<h3>0XNET-ALEXA-WV-PROBE-7c1f</h3>
<p>Security research test page (HackerOne 0xnet). It asks this browser for the microphone and camera,
shows whether they were given, and keeps nothing: no audio or video is stored or sent anywhere.</p>
<pre id="o" style="white-space:pre-wrap;word-break:break-all">starting</pre>
<script>
(function () {
  var o = document.getElementById('o');
  function log(s) { o.textContent += '\n' + s; }
  log('origin=' + location.origin);
  log('ua=' + navigator.userAgent);
  log('bridge ReactNativeWebView=' + (typeof window.ReactNativeWebView));
  log('secureContext=' + window.isSecureContext + ' mediaDevices=' + (typeof navigator.mediaDevices));
  async function run() {
    var t0 = Date.now();
    try {
      var s = await navigator.mediaDevices.getUserMedia({ audio: true });
      var tr = s.getAudioTracks()[0];
      log('AUDIO: GRANTED after ' + (Date.now() - t0) + ' ms; label=' + tr.label + '; state=' + tr.readyState);
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        var ac = new AC(); var src = ac.createMediaStreamSource(s); var an = ac.createAnalyser(); src.connect(an);
        var buf = new Uint8Array(an.fftSize); var peak = 0; var end = Date.now() + 1000;
        while (Date.now() < end) {
          an.getByteTimeDomainData(buf);
          for (var i = 0; i < buf.length; i++) { var d = Math.abs(buf[i] - 128); if (d > peak) peak = d; }
          await new Promise(function (r) { setTimeout(r, 50); });
        }
        log('AUDIO: 1 s level peak=' + peak + ' of 128; samples discarded');
        ac.close();
      } catch (e2) { log('AUDIO: level read failed ' + e2.name); }
      tr.stop(); log('AUDIO: track stopped');
    } catch (e) { log('AUDIO: DENIED ' + e.name + ': ' + e.message + ' after ' + (Date.now() - t0) + ' ms'); }
    var t1 = Date.now();
    try {
      var v = await navigator.mediaDevices.getUserMedia({ video: true });
      var vt = v.getVideoTracks()[0];
      log('VIDEO: GRANTED after ' + (Date.now() - t1) + ' ms; label=' + vt.label);
      vt.stop(); log('VIDEO: track stopped');
    } catch (e3) { log('VIDEO: DENIED ' + e3.name + ': ' + e3.message + ' after ' + (Date.now() - t1) + ' ms'); }
    log('done ' + new Date().toISOString());
  }
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) { run(); } else { log('no mediaDevices API here'); }
})();
</script>
</body></html>
