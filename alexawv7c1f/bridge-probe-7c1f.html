<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>0xnet bridge probe</title></head>
<body style="font:14px/1.35 sans-serif;padding:12px;background:#fff;color:#000">
<h3>0XNET-BRIDGE-PROBE-7c1f</h3>
<p>Security research test page (HackerOne 0xnet). It lists which native interfaces this page can see and prints the
result here. It calls no interface method, reads no token, and sends nothing anywhere.</p>
<pre id="o" style="white-space:pre-wrap;word-break:break-all">starting</pre>
<script>
(function () {
  var o = document.getElementById('o');
  function log(s) { o.textContent += '\n' + s; }
  log('href=' + location.href);
  log('ua=' + navigator.userAgent);
  var names = [];
  try { names = Object.getOwnPropertyNames(window); } catch (e) {}
  var std = /^(on|webkit|Webkit|HTML|SVG|CSS|Intl|WebGL|Audio|RTC|Media|IDB|XR|GPU|Document|Element|Node|Text|Range|Event|Error|Array|Promise|Symbol|Map|Set|Weak|Reflect|Proxy|Math|JSON|Date|RegExp|String|Number|Boolean|Object|Function|BigInt|Atomics|Shared|Data|Float|Int|Uint|URL|Blob|File|Form|Request|Response|Headers|Worker|Broadcast|Message|Notification|Performance|Navigator|Screen|Storage|Crypto|Subtle|Text|Readable|Writable|Transform|Compression|Decompression|Abort|Animation|Keyframe|Mutation|Intersection|Resize|Report|Path2D|Image|OffscreenCanvas|Canvas|ClipboardItem|Selection|Shadow|Custom|Visual|Window|History|Location|BarProp|External|Gamepad|Geolocation|Battery|Bluetooth|USB|Serial|HID|Credential|PublicKey|Payment|Presentation|Remote|Sensor|Accelerometer|Gyroscope|Magnetometer|Orientation|Ambient|Linear|Absolute|Relative|Wake|Lock|Lock|Scheduler|Task|Trusted|Launch|Navigation|Origin|Close|Cookie|Content|Font|Highlight|Ink|Keyboard|Layout|Mathml|Pointer|Touch|Wheel|Drag|Focus|Input|Composition|Clipboard|Progress|Security|Speech|Sync|Push|Service|Cache|Background|Periodic|Device|Delegated|Fenced|Shared|Video|Track|Time|Hash|Idle|Profiler|Virtual|Eye|Window|Viewport|XPath|XML|XSLT|DOM|Option|Plugin|MimeType|Statement|Transition|View|Web)/;
  var hits = names.filter(function (n) {
    if (/Interface|Bridge|bridge|MAP|Native|native|Android|android|JSInterface|Jsi|jsi|Amazon|amazon|Seller|seller|mShop|Token|token/.test(n)) return true;
    return false;
  });
  log('window props matching bridge-like names: ' + JSON.stringify(hits));
  hits.forEach(function (n) {
    var t; try { t = typeof window[n]; } catch (e) { t = 'err'; }
    var keys = [];
    try { if (window[n] && (t === 'object' || t === 'function')) { for (var k in window[n]) keys.push(k); } } catch (e) {}
    log('  ' + n + ': ' + t + ' methods=' + JSON.stringify(keys.slice(0, 40)));
  });
  log('done ' + new Date().toISOString());
})();
</script></body></html>
